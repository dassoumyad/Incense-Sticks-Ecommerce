# Include these locations inside the HTTPS server block for
# computerscienceandengineering.tech. Replace any existing /api location
# instead of adding a duplicate location block.

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8500;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Product images are served by Express from /assets as well.
location ^~ /assets/ {
    proxy_pass http://127.0.0.1:8500;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /health {
    proxy_pass http://127.0.0.1:8500/health;
    proxy_set_header Host $host;
}
